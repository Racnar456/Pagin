<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Cosas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #lista {
            margin-top: 20px;
        }
        .item {
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 5px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>Agregar Cosas</h1>

    <input type="text" id="nuevaCosa" placeholder="Escribe algo...">
    <button onclick="agregarCosa()">Agregar</button>

    <div id="lista">
        <!-- Aquí se mostrarán las cosas agregadas -->
    </div>

    <script>
        function agregarCosa() {
            // Obtener el valor del campo de texto
            var nuevaCosa = document.getElementById('nuevaCosa').value;

            // Verificar que el campo no esté vacío
            if (nuevaCosa.trim() !== "") {
                // Crear un nuevo elemento de lista
                var nuevoItem = document.createElement('div');
                nuevoItem.className = 'item';
                nuevoItem.textContent = nuevaCosa;

                // Agregar el nuevo elemento a la lista
                document.getElementById('lista').appendChild(nuevoItem);

                // Limpiar el campo de texto
                document.getElementById('nuevaCosa').value = '';
            } else {
                alert("Por favor, escribe algo antes de agregar.");
            }
        }
    </script>

</body>
</html>
